<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>边缘设备监控终端</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { background: #121212; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #00e5ff; letter-spacing: 2px; }
        .card { background: #1e1e1e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,229,255,0.1); border: 1px solid #333; }
        #chart { width: 100%; height: 600px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>设备实时温度监控</h1>
    </div>
    <div class="card">
        <div id="chart"></div>
    </div>

    <script>
        var myChart = echarts.init(document.getElementById('chart'));
        
        var option = {
            backgroundColor: '#1e1e1e',
            title: { text: '历史温度曲线', textStyle: { color: '#eee' }, left: 'center' },
            tooltip: { trigger: 'axis' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
            xAxis: { 
                type: 'category', 
                boundaryGap: false, 
                data: [],
                axisLabel: { color: '#aaa' },
                axisLine: { lineStyle: { color: '#555' } }
            },
            yAxis: { 
                type: 'value', 
                name: '温度(℃)', 
                nameTextStyle: { color: '#aaa' },
                axisLabel: { color: '#aaa' },
                splitLine: { lineStyle: { color: '#333' } }
            },
            series: [{
                name: '温度',
                type: 'line',
                smooth: true,
                symbol: 'circle',
                symbolSize: 8,
                itemStyle: { color: '#00e5ff' },
                areaStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: 'rgba(0, 229, 255, 0.6)' },
                        { offset: 1, color: 'rgba(0, 229, 255, 0.05)' }
                    ])
                },
                data: []
            }]
        };
        myChart.setOption(option);

        function fetchData() {
            fetch('/api/history')
                .then(res => res.json())
                .then(data => {
                    // 接口返回的是倒序（最新在前），图表需要正序（时间从左到右）
                    data.reverse(); 
                    let times = data.map(item => item.time);
                    let values = data.map(item => item.value);
                    
                    myChart.setOption({
                        xAxis: { data: times },
                        series: [{ data: values }]
                    });
                })
                .catch(err => console.log("请求失败", err));
        }

        fetchData();
        setInterval(fetchData, 1000); // 每秒刷新一次
    </script>
</body>
</html>
